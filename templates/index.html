<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Equipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body class="min-h-screen flex items-center justify-center relative">

    <!-- FONDO -->
    <div class="absolute inset-0">
        <img src="{{ url_for('static', filename='image/image.png') }}"
             class="w-full h-full object-cover opacity-40"
             alt="Fondo">
    </div>

    <div class="absolute inset-0 bg-black bg-opacity-40"></div>

    <!-- CARD -->
    <div class="relative w-full max-w-3xl bg-gray-900 bg-opacity-85 p-10 rounded-2xl shadow-2xl backdrop-blur-xl">

        <h1 class="text-center text-3xl font-bold mb-8 text-white">
            Registro de Computadora
        </h1>

        <form action="/registrar" method="POST" enctype="multipart/form-data"
              class="grid grid-cols-2 gap-6 text-white">

            <!-- Código -->
            <div>
                <label class="text-sm font-semibold">Código *</label>
                <input name="codigo" required maxlength="15"
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700 focus:ring focus:ring-blue-600">
            </div>

            <!-- Tipo -->
            <div>
                <label class="text-sm font-semibold">Tipo de equipo *</label>
                <select name="tipo_equipo" required
                        class="w-full p-2 rounded bg-gray-800 border border-gray-700">
                    <option value="">Seleccione</option>
                    <option>PC</option>
                    <option>Laptop</option>
                    <option>Servidor</option>
                </select>
            </div>

            <!-- Marca -->
            <div>
                <label class="text-sm font-semibold">Marca *</label>
                <input name="marca" required
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>

            <!-- Modelo -->
            <div>
                <label class="text-sm font-semibold">Modelo *</label>
                <input name="modelo" required
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>

            <!-- Sistema Operativo -->
            <div>
                <label class="text-sm font-semibold">Sistema operativo *</label>
                <select name="sistema" required
                        class="w-full p-2 rounded bg-gray-800 border border-gray-700">
                    <option value="">Seleccione</option>
                    <option>Windows</option>
                    <option>Linux</option>
                    <option>MacOS</option>
                </select>
            </div>

            <!-- RAM -->
            <div>
                <label class="text-sm font-semibold">RAM (GB) *</label>
                <input name="ram" type="number" min="2" required
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>

            <!-- Almacenamiento -->
            <div>
                <label class="text-sm font-semibold">Almacenamiento (GB) *</label>
                <input name="almacenamiento" type="number" min="50" required
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>

            <!-- Fecha mantenimiento -->
            <div>
                <label class="text-sm font-semibold">Fecha de mantenimiento *</label>
                <input name="fecha_mantenimiento" type="date" required
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>

            <!-- Fecha registro -->
            <div>
                <label class="text-sm font-semibold">Fecha de registro *</label>
                <input name="fecha_registro" type="date" required
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>

            <!-- Estado -->
            <div>
                <label class="text-sm font-semibold">Estado *</label>
                <select name="estado" required
                        class="w-full p-2 rounded bg-gray-800 border border-gray-700">
                    <option>Activo</option>
                    <option>Inactivo</option>
                    <option>En mantenimiento</option>
                </select>
            </div>

            <!-- Imagen -->
            <div class="col-span-2">
                <label class="text-sm font-semibold">Imagen del equipo (opcional)</label>
                <input type="file" name="imagen" id="imagenInput"
                       class="w-full p-2 rounded bg-gray-800 border border-gray-700" accept="image/*">

                <img id="preview" class="mt-4 w-40 rounded hidden shadow-lg">
            </div>

            <!-- Botón -->
            <div class="col-span-2 flex justify-center">
                <button
                    class="px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg shadow-lg transition font-semibold">
                    Registrar Equipo
                </button>
            </div>
        </form>
    </div>

<script>
    const inputImg = document.getElementById("imagenInput");
    const preview = document.getElementById("preview");

    inputImg.addEventListener("change", () => {
        const file = inputImg.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
            preview.src = reader.result;
            preview.classList.remove("hidden");
        };
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
